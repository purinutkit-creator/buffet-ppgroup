<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Print Station</title>
  <link rel="stylesheet" href="/shared/base.css">
  <style>
    body { background: var(--surface); }
    .wrap { padding: 16px; max-width: 900px; margin: 0 auto; display: grid; gap: 12px; align-content: start; overflow: auto; }
    .pcard { display: grid; gap: 10px; }
    .log { font-family: ui-monospace, monospace; font-size: 12px; max-height: 160px; overflow: auto; background: #0f172a; color: #cbd5e1; border-radius: 10px; padding: 8px; white-space: pre-wrap; }
    .ok { color: var(--success); font-weight: 700; } .bad { color: var(--danger); font-weight: 700; }
    .support span { margin-right: 12px; }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/core.js"></script>
  <script src="/print-station/station.js"></script>
</body>
</html>
